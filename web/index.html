<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>HermesSlicer</title>
    <link rel="icon" href="/assets/hermes-orca-minimal.svg" type="image/svg+xml">
    <link rel="icon" href="/assets/hermes-slicer-icon-32.png" sizes="32x32" type="image/png">
    <link rel="apple-touch-icon" href="/assets/hermes-slicer-icon-256.png">
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body class="session-locked">
    <section id="authGate" class="auth-gate" aria-label="Hermes Slicer login">
      <div class="auth-shell">
        <h1 class="sr-only">Hermes Slicer</h1>
        <img class="auth-logo" src="/assets/hermes-slicer-login.png" alt="Hermes Slicer OS, Hermes Agent plus Orca Slicer">
        <form id="authForm" class="auth-card" novalidate>
          <header class="auth-card-header">
            <h2><span>Hermes</span> Slicer <em>Login</em></h2>
            <p>Intelligent. Precise. Powerful.</p>
          </header>

          <label class="auth-field" for="authEmail">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
              <circle cx="12" cy="7" r="4"></circle>
            </svg>
            <input id="authEmail" name="username" autocomplete="username" placeholder="Email or Username" aria-describedby="authError" required>
          </label>

          <label class="auth-field" for="authPassword">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <rect x="5" y="11" width="14" height="10" rx="2"></rect>
              <path d="M8 11V7a4 4 0 0 1 8 0v4"></path>
            </svg>
            <input id="authPassword" name="password" type="password" autocomplete="current-password" placeholder="Password" aria-describedby="authError" required>
            <button id="authPasswordToggle" class="auth-eye" type="button" aria-label="Show password">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </label>

          <button id="authContinue" class="auth-primary" type="submit">Sign In <span aria-hidden="true">-&gt;</span></button>

          <div class="auth-row">
            <label class="auth-check">
              <input type="checkbox" name="remember">
              <span>Remember me</span>
            </label>
            <button id="authForgot" class="auth-link" type="button">Forgot password?</button>
          </div>

          <div class="auth-divider"><span>OR</span></div>

          <button id="authCreate" class="auth-secondary" type="button">
            <span aria-hidden="true">+</span>
            Sign Up / Create Account
          </button>

          <p id="authError" class="auth-error" role="status" aria-live="polite"></p>

          <footer class="auth-feature-row" aria-label="Hermes Slicer identity">
            <div class="auth-feature">
              <span class="auth-feature-icon"><img src="/assets/hermes-orca-minimal.svg" alt=""></span>
              <span><strong>Hermes Agent</strong><small>Smart Automation</small></span>
            </div>
            <div class="auth-feature">
              <span class="auth-feature-icon"><img src="/assets/hermes-orca-primary.svg" alt=""></span>
              <span><strong>Orca Slicer</strong><small>Precision Slicing</small></span>
            </div>
          </footer>
        </form>
      </div>
    </section>

    <main id="panel" class="panel" aria-label="Hermes Agent tool console">
      <header id="dragHandle" class="panel-header" tabindex="0" aria-label="Panel drag handle. Use arrow keys to move the panel.">
        <div class="brand">
          <img class="brand-mark" src="/assets/hermes-orca-minimal.svg" alt="" aria-hidden="true">
          <span id="statusDot" class="status-dot" aria-hidden="true"></span>
          <div>
            <h1>Hermes Agent Tool Console</h1>
            <p id="bridgeStatus">checking bridge</p>
          </div>
        </div>
        <div class="header-actions">
          <button id="resetPosition" class="icon-button" type="button" title="Reset position" aria-label="Reset panel position">reset</button>
          <button id="collapseButton" class="icon-button" type="button" title="Hide panel" aria-label="Hide panel" aria-controls="panel" aria-expanded="true">-</button>
        </div>
      </header>

      <section class="quick-actions" aria-label="Quick actions">
        <button data-action="bridge.actions" type="button">bridge.actions</button>
        <button data-action="hermes.proof_mcp" type="button">hermes.proof_mcp</button>
        <button data-action="slice.export_preflight" type="button">slice.export_preflight</button>
        <button data-action="proof.recent" type="button">proof.recent</button>
        <button data-action="orca.version" type="button">orca.version</button>
        <button data-action="slice.dry_run" type="button">slice.dry_run</button>
      </section>

      <section id="conversation" class="conversation" aria-live="polite"></section>

      <form id="toolForm" class="tool-form">
        <button id="micButton" class="icon-button" type="button" title="Push to talk" aria-label="Push to talk" aria-pressed="false">mic</button>
        <label class="sr-only" for="toolInput">Tool request</label>
        <input id="toolInput" name="message" autocomplete="off" placeholder="Tool ID or request" />
        <button type="submit">Run Tool</button>
        <button id="stopButton" class="icon-button" type="button" title="Stop speaking" aria-label="Stop speaking">stop</button>
      </form>

      <details class="settings" open>
        <summary>Hermes Agent routing</summary>
        <div class="settings-grid">
          <label>
            Agent
            <select id="agentSelect"></select>
          </label>
          <label>
            Name
            <input id="agentName" />
          </label>
          <label class="wide">
            Azure English voice
            <select id="voiceSelect"></select>
          </label>
          <div class="provider-row">
            <span id="providerBadge" class="provider-badge">MiniMax</span>
            <button id="saveAgent" type="button">Save Voice</button>
          </div>
        </div>
      </details>

      <aside class="proof" aria-labelledby="proofTitle">
        <div class="proof-title">
          <span id="proofTitle">Tool proof</span>
          <button id="refreshProof" type="button">Refresh</button>
        </div>
        <pre id="proofDrawer" tabindex="0">proof/ledger.jsonl</pre>
      </aside>
    </main>

    <button id="dockButton" class="dock-button" type="button" aria-controls="panel" aria-expanded="false" hidden>Hermes Tools</button>
    <script src="/app.js" defer></script>
  </body>
</html>
